name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 对应 package.json 的 engines: ^22.19.0 || >=24.0.0
        node: ['22.19.0', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      # 注意：内核包在 npm 上的 latest 标签多数还停在 0.0.1-rc.1，
      # 所以 devDependencies 里必须写精确版本（见 package.json）。
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

      # 这一层校验的是构建产物本身（DSH 实际加载 lib/index.js）
      - name: Verify built artifact
        run: pnpm run test:artifact

      # 本模板选择把 lib/ 提交进仓库；产物与源码不一致必须硬失败
      - name: Fail if committed build output is stale
        if: matrix.node == '24'
        run: |
          if [ -n "$(git status --porcelain -- lib)" ]; then
            echo "::error::lib/ 与 src/ 不同步，请在本地跑 pnpm run build 并提交"
            git status --short -- lib
            exit 1
          fi

      # 把 files 白名单漏项变成硬失败（漏了 cordis.patch.yml 会静默装不上）
      - name: Verify published file set
        if: matrix.node == '24'
        run: |
          npm pack --dry-run 2>&1 | tee pack.txt
          for f in cordis.patch.yml lib/index.js lib/index.d.ts README.md LICENSE; do
            grep -q "$f" pack.txt || { echo "::error::files 白名单缺少 $f"; exit 1; }
          done
